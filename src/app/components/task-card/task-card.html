<article
  class="flex h-full flex-col gap-5 rounded-2xl border border-border bg-surface p-6 shadow-sm"
>
  <div class="flex flex-wrap items-center justify-between gap-2">
    <span
      class="rounded-full px-3 py-1 text-xs font-semibold"
      [attr.data-priority]="task().priority"
      [class]="
        task().priority === 'high'
          ? 'bg-red-50 text-red-700'
          : task().priority === 'medium'
            ? 'bg-amber-50 text-amber-800'
            : 'bg-emerald-50 text-emerald-800'
      "
    >
      {{ priorityLabels[task().priority] }}
    </span>

    <span
      class="rounded-full px-3 py-1 text-xs font-semibold"
      [attr.data-status]="task().status"
      [class]="
        task().status === 'completed'
          ? 'bg-emerald-50 text-emerald-800'
          : task().status === 'in_progress'
            ? 'bg-blue-50 text-blue-700'
            : 'bg-amber-50 text-amber-800'
      "
    >
      {{ statusLabels[task().status] }}
    </span>
  </div>

  <h3 class="text-lg font-semibold wrap-anywhere">
    {{ task().title }}
  </h3>

  <p class="text-sm leading-6 whitespace-pre-wrap text-muted wrap-anywhere">
    {{ task().description || 'No description provided.' }}
  </p>

  <div class="mt-auto flex flex-col gap-1 border-t border-border pt-4 text-sm">
    <span class="text-muted">Assigned to</span>

    <strong class="font-semibold wrap-anywhere">
      {{ task().assignee }}
    </strong>
  </div>

  <div class="border-t border-border pt-4">
    @if (confirmingDelete()) {
      <p class="mb-3 text-sm font-medium" role="alert">Delete this task?</p>

      <div class="flex flex-wrap gap-2">
        <button
          type="button"
          class="cursor-pointer rounded-lg border border-red-700 bg-red-700 px-3 py-2 text-sm font-semibold text-white enabled:hover:bg-red-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-700 disabled:cursor-not-allowed disabled:opacity-60"
          (click)="deleteRequested.emit(task().id)"
          [disabled]="disabled()"
        >
          {{ deleting() ? 'Deleting...' : 'Yes, delete' }}
        </button>

        <button
          type="button"
          class="cursor-pointer rounded-lg border border-border px-3 py-2 text-sm font-semibold enabled:hover:bg-background focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-60"
          (click)="confirmingDelete.set(false)"
          [disabled]="disabled()"
        >
          Cancel
        </button>
      </div>
    } @else {
      <div class="flex gap-2">
        <button
          type="button"
          class="cursor-pointer rounded-lg border border-border px-3 py-2 text-sm font-semibold enabled:hover:bg-background focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-60"
          (click)="editRequested.emit(task())"
          [disabled]="disabled()"
          aria-label="Edit task {{ task().title }}"
        >
          Edit
        </button>

        <button
          type="button"
          class="cursor-pointer rounded-lg border border-red-200 px-3 py-2 text-sm font-semibold text-red-700 enabled:hover:bg-red-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-700 disabled:cursor-not-allowed disabled:opacity-60"
          (click)="confirmingDelete.set(true)"
          [disabled]="disabled()"
          aria-label="Delete task {{ task().title }}"
        >
          Delete
        </button>
      </div>
    }
  </div>
</article>
